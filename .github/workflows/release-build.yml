# Builds and attests a release. Called by release.yml.
#
# SLSA Build L3: the build can't forge its own provenance.
# - The build job runs our code and gets no id-token. Only the provenance job
#   signs, and it runs only GitHub's actions.
# - As a reusable workflow, the signature names this file.
#   `gh attestation verify --signer-workflow` checks for it.
name: Release build

on:
  workflow_call:

permissions: {}

jobs:
  image:
    name: Image and SBOM
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # ghcr.io
    outputs:
      name: ${{ steps.image.outputs.name }}
      digest: ${{ steps.push.outputs.digest }}
    steps:
      - uses: actions/checkout@v7

      # ghcr.io needs a lowercase owner.
      - name: Name the image
        id: image
        run: |
          owner=$(echo "${GITHUB_REPOSITORY_OWNER}" | tr '[:upper:]' '[:lower:]')
          echo "name=ghcr.io/$owner/keera-chat" >> "$GITHUB_OUTPUT"
          echo "ref=ghcr.io/$owner/keera-chat:${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"

      # `sbom` also builds the image. VERSION is set since the context has no .git.
      - name: Build the image and its SBOM
        run: make sbom CHAT_IMAGE='${{ steps.image.outputs.ref }}' VERSION="$GITHUB_REF_NAME"

      # Attest the digest, since a tag can move.
      - name: Push
        id: push
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "$GITHUB_TOKEN" | podman login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          podman push '${{ steps.image.outputs.ref }}' --digestfile=digest.txt
          echo "digest=$(cat digest.txt)" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v7
        with:
          name: sbom
          path: build/sbom/keera-chat.cdx.json
          if-no-files-found: error

  image-provenance:
    name: Image provenance
    needs: image
    runs-on: ubuntu-latest
    permissions:
      packages: write # to push the attestation next to the image
      id-token: write # the OIDC token the attestation is signed against
      attestations: write # the attestation itself
      artifact-metadata: write # the storage record for the pushed image
    steps:
      # The attestation step uses docker's credentials.
      - name: Log in to ghcr.io
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "$GITHUB_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin

      - name: Attest the build
        uses: actions/attest-build-provenance@v4
        with:
          subject-name: ${{ needs.image.outputs.name }}
          subject-digest: ${{ needs.image.outputs.digest }}
          # So it can be verified from the image alone.
          push-to-registry: true

  # Last, so a release never shows an image without provenance.
  publish:
    name: Publish the release
    needs: image-provenance
    runs-on: ubuntu-latest
    permissions:
      contents: write # the release and its files
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: sbom
          path: build/sbom

      # Upload if the release was already created in the web UI.
      - name: Publish the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes \
            build/sbom/keera-chat.cdx.json \
          || gh release upload "$GITHUB_REF_NAME" --clobber \
            build/sbom/keera-chat.cdx.json
