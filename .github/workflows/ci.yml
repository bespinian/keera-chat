name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

# Cancel older runs on a branch, but keep every run on main.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  # Like the build. The test step enables it for the race detector.
  CGO_ENABLED: "0"

jobs:
  check:
    name: Format, vet, lint and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      # Before lint, since formatting is the easier fix.
      - name: Check formatting
        run: make fmt-check

      - name: Vet
        run: make vet

      # Pinned, so a new linter release can't break an old commit.
      - name: Lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.15

      - name: Build
        run: make build

  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Test
        run: make test
        env:
          CGO_ENABLED: "1"
