# A tag releases the image, its SBOM and a provenance attestation.
#
# Built in CI, not locally, so GitHub can sign where the image came from.
# See release-build.yml for details.
name: Release

on:
  push:
    tags: ["v*"]

# Upper bound. Each job in release-build.yml asks for less.
permissions:
  contents: write
  packages: write
  id-token: write
  attestations: write
  artifact-metadata: write

jobs:
  release:
    uses: ./.github/workflows/release-build.yml
